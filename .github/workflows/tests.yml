name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The geometry tests only need these three packages, so skip the rest.
      - run: pip install numpy pandas pytest
      - run: python -m pytest -q
